name = "edurank-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "edurank-app-db"
database_id = "56bf6632-cc9f-4296-9a6d-3ca032bf2bee"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "NOTES_BUCKET"
bucket_name = "edurank-notes"

[ai]
binding = "AI"

[vars]
# Permissive CORS for now — we'll lock it down once the Vercel domain is known.
# Origins that hit the API are: the web app on Vercel (any preview or prod URL
# under *.vercel.app / edurank.co.za), plus local dev.
ALLOWED_ORIGINS = "*"
