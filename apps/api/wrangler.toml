name = "edurank-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Custom domain — the worker also responds at api.edurank.co.za (in addition
# to the default edurank-api.jacquesd264160.workers.dev URL). This is the URL
# the browser uses, because some networks can't resolve *.workers.dev.
routes = [
  { pattern = "api.edurank.co.za", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "edurank-app-db"
database_id = "56bf6632-cc9f-4296-9a6d-3ca032bf2bee"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "NOTES_BUCKET"
bucket_name = "edurank-notes"

[ai]
binding = "AI"

[vars]
# Origins that hit the API. Update this list when new deploy previews
# appear. The default is permissive; once the live URLs are stable we
# can lock this down to just edurank.co.za.
ALLOWED_ORIGINS = "https://edurank.co.za,https://www.edurank.co.za,https://edurank.pages.dev,https://*.edurank.pages.dev,http://localhost:3000"
