name = "edurank-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Custom domain — the worker also responds at api.edurank.co.za (in addition
# to the default edurank-api.jacquesd264160.workers.dev URL). This is the URL
# the browser uses, because some networks can't resolve *.workers.dev.
routes = [
  { pattern = "api.edurank.co.za", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "edurank-app-db"
database_id = "56bf6632-cc9f-4296-9a6d-3ca032bf2bee"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "NOTES_BUCKET"
bucket_name = "edurank-notes"

[ai]
binding = "AI"

[vars]
# Origins allowed to call the API (browser CORS).
# Permanent rules — we do NOT hand-list every deployment:
#   - any Cloudflare Pages origin (edurank.pages.dev, every <hash> preview)
#   - the custom domain + www
#   - local dev
# The CORS matcher honors the `https://*.pages.dev` wildcard, so this never
# needs to change when Pages spins up new preview URLs. Do not use a bare `*`.
ALLOWED_ORIGINS = "https://edurank.co.za,https://www.edurank.co.za,https://*.pages.dev,http://localhost:3000,http://localhost:8787"

# Canonical app origin used to build email verification / reset links.
APP_URL = "https://edurank.co.za"

# Unix-ms cutoff for the FOUNDER early-access reward. Set 0 to close the window.
# Leave unset to use the default (2027-03-01).
# EARLY_ACCESS_UNTIL = ""
