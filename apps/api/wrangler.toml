name = "edurank-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "edurank-app-db"
database_id = "56bf6632-cc9f-4296-9a6d-3ca032bf2bee"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "NOTES_BUCKET"
bucket_name = "edurank-notes"

[ai]
binding = "AI"

[vars]
# Production Pages origin + every preview/branch deployment under the same
# Pages project (one per git branch). Each preview URL is on its own
# subdomain, so we list the production one and the exact preview we're
# shipping to today. Add new previews here as needed.
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,https://edurank.pages.dev,https://58e3323d.edurank.pages.dev"
